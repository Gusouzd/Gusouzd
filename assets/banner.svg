<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Gustavo Rafael — Analista de Migração &amp; Dados" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1b33"/>
      <stop offset="1" stop-color="#132a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .t { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .flow { stroke-dasharray: 6 10; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .p2 { animation-delay: .8s; } .p3 { animation-delay: 1.6s; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .fade { opacity: 0; animation: fade 1s ease-out .2s forwards; }
      @keyframes fade { to { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- Texto -->
  <g class="fade">
    <text x="64" y="92" class="m" font-size="18" fill="#38bdf8">~/gustavo $ whoami</text>
    <text x="64" y="150" class="t" font-size="52" font-weight="700" fill="#f1f5f9">Gustavo Rafael</text>
    <text x="64" y="194" class="t" font-size="26" font-weight="600" fill="url(#accent)">Analista de Migração &amp; Dados</text>
    <text x="64" y="236" class="t" font-size="17" fill="#94a3b8">Python · SQL · BigQuery · dbt · PostgreSQL · Power BI</text>
  </g>

  <!-- Pipeline: Legado → ETL → Dados -->
  <g transform="translate(650,70)">
    <path d="M110 72 H190" stroke="#38bdf8" stroke-width="3" fill="none" class="flow"/>
    <path d="M300 72 H380" stroke="#a78bfa" stroke-width="3" fill="none" class="flow"/>

    <!-- Legado -->
    <g class="pulse">
      <rect x="0" y="22" width="110" height="100" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <rect x="22" y="44" width="66" height="10" rx="3" fill="#475569"/>
      <rect x="22" y="62" width="66" height="10" rx="3" fill="#475569"/>
      <rect x="22" y="80" width="66" height="10" rx="3" fill="#475569"/>
      <circle cx="80" cy="49" r="2.5" fill="#22c55e"/><circle cx="80" cy="67" r="2.5" fill="#22c55e"/><circle cx="80" cy="85" r="2.5" fill="#f59e0b"/>
      <text x="55" y="146" text-anchor="middle" class="m" font-size="13" fill="#94a3b8">legado</text>
    </g>

    <!-- ETL -->
    <g class="pulse p2">
      <rect x="190" y="22" width="110" height="100" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <path d="M222 52 l12 20 -12 20" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="244" y="86" width="26" height="5" rx="2" fill="#38bdf8"/>
      <text x="245" y="146" text-anchor="middle" class="m" font-size="13" fill="#94a3b8">pipeline</text>
    </g>

    <!-- Dados -->
    <g class="pulse p3">
      <rect x="380" y="22" width="110" height="100" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
      <rect x="404" y="82" width="12" height="22" rx="2" fill="#a78bfa"/>
      <rect x="422" y="66" width="12" height="38" rx="2" fill="#a78bfa" fill-opacity=".8"/>
      <rect x="440" y="50" width="12" height="54" rx="2" fill="#38bdf8"/>
      <rect x="458" y="60" width="12" height="44" rx="2" fill="#38bdf8" fill-opacity=".8"/>
      <text x="435" y="146" text-anchor="middle" class="m" font-size="13" fill="#94a3b8">insights</text>
    </g>
  </g>
</svg>
